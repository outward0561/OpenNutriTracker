name: Build debug APK artifact

on:
  push:
    branches:
      - ci/build-debug-apk-20261108

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-cache

      - name: Generate stub .env for CI
        uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: https://stub.supabase.co
          supabase_project_anon_key: ci-stub

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --flavor full --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: opennutritracker-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
