name: Release comparison APK
run-name: Release comparison APK (${{ github.ref_name }})

on:
  push:
    branches:
      - ci/pr-release-comparison
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release comparison APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter-cache
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}

      - name: Create placeholder environment
        uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: https://stub.supabase.co
          supabase_project_anon_key: ci-stub

      - name: Check optional Supabase configuration
        id: backend
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PROJECT_ANON_KEY: ${{ secrets.SUPABASE_PROJECT_ANON_KEY }}
        run: |
          if [[ -n "$SUPABASE_PROJECT_URL" && -n "$SUPABASE_PROJECT_ANON_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Supabase reference-food search is unconfigured in this comparison build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create configured environment
        if: steps.backend.outputs.configured == 'true'
        uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: ${{ secrets.SUPABASE_PROJECT_URL }}
          supabase_project_anon_key: ${{ secrets.SUPABASE_PROJECT_ANON_KEY }}

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Dart sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create temporary test signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ont-comparison.jks" \
            -storepass android -keypass android -alias comparison \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ONT Comparison, O=Android, C=US"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/ont-comparison.jks"
            printf 'storePassword=android\nkeyPassword=android\nkeyAlias=comparison\n'
          } > android/key.properties

      - name: Build release comparison APK
        run: flutter build apk --flavor comparison --release

      - name: Upload comparison APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenNutriTracker-Release-Comparison
          path: build/app/outputs/flutter-apk/app-comparison-release.apk
          if-no-files-found: error
          retention-days: 14
